# JADAI STUDIOS — Render API service
# Frontend: Cloudflare Pages (static, dist/)  →  proxies /api/* and /s/* here.
# Alternative: set SERVE_STATIC=1 to let this service serve the SPA too (no Pages needed).
#
# PERSISTENT DATA: the server writes fs stores under DATA_DIR (default ./data):
# chat sessions, artifacts, uploaded files + RAG index, memory, entitlements,
# signal stores. The `disk` block below mounts a persistent disk at /var/data
# and DATA_DIR points the server there, so all of it survives redeploys.
#
# NOTE: Render disks require the Starter plan ($7/mo). If you stay on Free,
# DELETE the `disk:` block and the DATA_DIR env var — everything still works,
# but ./data resets on every redeploy/restart (see docs/02-DEPLOYMENT.md §5b).
services:
  - type: web
    name: jadai-api
    runtime: node
    plan: free            # upgrade to starter in the dashboard to use the disk
    region: oregon
    buildCommand: npm ci
    startCommand: npm run start
    healthCheckPath: /api/health
    disk:
      name: jadai-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_STATIC
        value: "0"
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: jadaistudiosoffcl@gmail.com
      # Set these in the Render dashboard (sensitive / user-specific):
      #   ADMIN_PASSWORD_HASH   (npm run gen:admin-hash)
      #   SUPABASE_SERVICE_ROLE_KEY
      #   NEXT_PUBLIC_SUPABASE_URL
      #   NEXT_PUBLIC_SUPABASE_ANON_KEY
      #   PAYSTACK_SECRET_KEY             (live: sk_live_...)
      #   NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY (live: pk_live_...)
      #   GROQ_API_KEY        — REQUIRED for AI (console.groq.com/keys)
      #   OPENAI_API_KEY      — optional; needs active credits or breaker parks it
      #   GEMINI_API_KEY      — optional tertiary
      #   NEXT_PUBLIC_GIPHY_API_KEY — optional GIF search (developers.giphy.com)
      #   NEXT_PUBLIC_APP_URL=https://jadai.dev
      # Full list + required/optional status: .env.example and docs/02-DEPLOYMENT.md §5
