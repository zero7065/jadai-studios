<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold-work" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#C9A84C"/>
      <stop offset="100%" stopColor="#e8c96a"/>
    </linearGradient>
  </defs>
  <!-- Three nested frames with gold star and crimson center -->
  <rect x="5" y="5" width="30" height="30" rx="3.5" stroke="url(#gold-work)" stroke-width="1.5"/>
  <rect x="10" y="10" width="20" height="20" rx="2" stroke="url(#gold-work)" stroke-width="1.5" opacity="0.6"/>
  <rect x="15" y="15" width="10" height="10" rx="1" stroke="url(#gold-work)" stroke-width="1.5" opacity="0.3"/>
  <!-- Star with crimson core -->
  <polygon points="20,16 21.2,19.2 24.5,19.2 22,21 23,24.2 20,22.2 17,24.2 18,21 15.5,19.2 18.8,19.2" fill="url(#gold-work)"/>
  <circle cx="20" cy="20.5" r="1.5" fill="#C0392B"/>
</svg>
